<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cetak QR Code E-Book</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
        }
        .poster {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            border: 8px solid #28a745;
        }
        h1 {
            color: #28a745;
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 800;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 25px;
        }
        img {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            border: 2px dashed #ccc;
            padding: 15px;
            background: #fff;
        }
        .footer-text {
            margin-top: 25px;
            font-weight: bold;
            color: #333;
            font-size: 20px;
        }
        .kkm-text {
            display: block;
            margin-top: 5px;
            font-size: 14px;
            font-weight: normal;
            color: #777;
        }
        .btn-print {
            margin-top: 30px;
            padding: 12px 25px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(40,167,69,0.3);
            transition: 0.3s;
        }
        .btn-print:hover {
            background: #218838;
        }
        @media print {
            body { background: white; align-items: flex-start; margin-top: 50px; }
            .poster { box-shadow: none; border: 4px solid black; }
            .btn-print { display: none; }
        }
    </style>
</head>
<body>

    <div class="poster">
        <h1>🌱 E-Book Panambangan</h1>
        <p>Panduan Cerdas Kelola Sampah</p>
        
        <!-- Memanggil gambar QR Code yang sudah tersimpan -->
        <img src="qrcode_website.png" alt="QR Code E-Book">
        
        <div class="footer-text">
            ⬇️ SCAN DI SINI ⬇️
            <span class="kkm-text">Persembahan KKM 14 Universitas Muhammadiyah Cirebon</span>
        </div>

        <button class="btn-print" onclick="window.print()">🖨️ Cetak Gambar Ini</button>
    </div>

</body>
</html>
